[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "coldfront"
version = "1.1.9"
requires-python = ">=3.10"
authors = [
    { name = "Andrew E. Bruno" },
    { name = "Dori Sajdak" },
    { name = "Mohammad Zia" },
]
description = "HPC Resource Allocation System"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSES/*.txt"]
keywords = ["high-performance-computing", "resource-allocation"]
classifiers = [
    'Programming Language :: Python :: 3',
    'Framework :: Django :: 4.2',
    'Topic :: Scientific/Engineering',
    'Topic :: System :: Systems Administration',
    'Topic :: Internet :: WWW/HTTP :: WSGI :: Application',
]
dependencies = [
    # Imported directly by coldfront.core.publication.views, which uses the 1.x API
    # (bibtexparser.bibdatabase) that 2.x removed. It otherwise arrives unbounded via
    # doi2bib, so without this an upgrade silently pulls 2.x and breaks the URLconf.
    "bibtexparser>=1.4,<2",
    "crispy-bootstrap5>=2025.6",
    "django>5.2,<6",
    "django-auth-ldap>=5.2.0",
    "django-crispy-forms>=2.3",
    "django-environ>=0.12.0",
    "django-filter>=25.1",
    "django-htmx>=1.27.0",
    "django-model-utils>=5.0.0",
    "django-q2>=1.7.6",
    "django-settings-export>=1.2.1",
    "django-simple-history>=3.8.0",
    "django-split-settings>=1.3.2",
    "django-su>=1.0.0",
    "django-vite>=3.1.0",
    "djangorestframework>=3.16.0",
    "djangosaml2>=1.12.0",
    "doi2bib>=0.4.0",
    "formencode>=2.1.1",
    "gunicorn>=23.0.0",
    "humanize>=4.12.2",
    "ldap3>=2.9.1",
    "psycopg>=3.3.4",
    "python-dateutil>=2.9.0.post0",
    "redis>=5.2.1",
]

[project.urls]
"Bug Tracker" = "https://github.com/coldfront/coldfront/issues"
Changelog = "https://github.com/coldfront/coldfront/blob/main/CHANGELOG.md"
Documentation = "https://docs.coldfront.dev"
"Source Code" = "https://github.com/coldfront/coldfront"

[project.scripts]
coldfront = "coldfront:manage"
gunicorn = "gunicorn.app.wsgiapp:run"

[project.optional-dependencies]
ldap = [
    "django-auth-ldap>=5.1.0",
    "ldap3>=2.9.1",
]
freeipa = [
    "dbus-python>=1.4.0",
    "ipaclient>=4.12.2",
    "setuptools>=80.6.0",
    "cryptography>=43.0.3",
]
iquota = [
    "kerberos>=1.3.1",
]
oidc = [
    "mozilla-django-oidc>=4.0.1",
]
mysql = [
    "mysqlclient>=2.2.7",
]
pg = [
    "psycopg2>=2.9.10",
]

# Tufts deployment extras. They are published only as git repos, hence the direct references (which require
# tool.hatch.metadata.allow-direct-references below).
tufts = [
    "django-redis>=7.0.0",
    "tufts-coldfront-plugins@git+https://github.com/Tufts-Technology-Services/tufts-coldfront-plugins.git",
    # All four of the storage plugin's extras; it defines no "all" extra, so they are listed out.
    # starfish/vast/truenas pull in the storage-backend API clients.
    "coldfront-storage-plugin[starfish,vast,truenas,pyinfra]@git+https://github.com/Tufts-Technology-Services/coldfront-storage-plugin.git@feature-pyinfra",
    # app: account_signup. Private repo: ssh remote, so installing needs a GitHub ssh key.
    "coldfront-account-signup-plugin@git+ssh://git@github.com/Tufts-Technology-Services/coldfront-account-signup-plugin.git",
    "coldfront-allocation-blueprint@git+https://github.com/Tufts-Technology-Services/coldfront-allocation-blueprint.git",
    "coldfront-user-management-plugin@git+https://github.com/Tufts-Technology-Services/coldfront-user-management-plugin.git",
    # app: coldfront_billing. Private repo under the TuftsRT org: ssh remote.
    "coldfront-billing@git+ssh://git@github.com/TuftsRT/coldfront-billing-plugin.git",
]

[dependency-groups]
dev = [
    "django-sslserver>=0.22",
    "django-upgrade>=1.29.1",
    "factory-boy>=3.3.3",
    "faker>=37.1.0",
    "pytest-django>=4.11.1",
    "reuse>=5.0.2",
    "ruff>=0.11.4",
]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-awesome-pages-plugin>=2.10.1",
    "mkdocstrings>=0.29.1",
    "mkdocstrings-python>=1.16.10",
    "pygments",
    "pymdown-extensions",
]

[tool.hatch.metadata]
# The tufts extra pulls plugins straight from git; hatchling rejects those otherwise.
allow-direct-references = true

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

[tool.uv]
required-version = ">=0.9.13" # Make sure this version matches what is in the Dockerfile
# tufts-coldfront-plugins depends on coldfront-storage-plugin at its default branch, which
# conflicts with the feature-pyinfra branch deployed on coldfront-p01. Force the deployed
# branch (and its extras) everywhere, since uv allows only one URL per package.
override-dependencies = [
    "coldfront-storage-plugin[starfish,vast,truenas,pyinfra]@git+https://github.com/Tufts-Technology-Services/coldfront-storage-plugin.git@feature-pyinfra",
]

[tool.ruff]
line-length = 120
indent-width = 4
target-version = "py312"

[tool.ruff.lint]
select = [
    "E4", 
    "E7", 
    "E9", 
    "F", 
    "I", 
    "S308", 
    "S113",
]

[tool.ruff.format]
indent-style = "space"
docstring-code-format = true
